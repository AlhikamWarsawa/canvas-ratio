services:
  canvas-ratio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canvas-ratio
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      MCP_API_KEY: ${MCP_API_KEY}
    volumes:
      - ./docker-data:/app/docker-data
    restart: unless-stopped
